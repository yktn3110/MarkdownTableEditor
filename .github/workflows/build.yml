name: Build

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA
        shell: bash
        run: npm run build:sea

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath tabledraft-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tabledraft-windows
          path: tabledraft-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tabledraft-windows.zip
