name: Build

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA
        shell: bash
        run: npm run build:sea

      - name: Zip release
        shell: pwsh
        run: Compress-Archive -Path release\* -DestinationPath tabledraft-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: tabledraft-windows.zip
